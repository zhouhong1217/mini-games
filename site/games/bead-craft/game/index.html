<!-- 4399 cconb -> dbbin fix -->
<script>
(function () {

    const timer = setInterval(function () {

        if (window.cc &&
            cc.assetManager &&
            cc.assetManager.downloader) {

            const downloader = cc.assetManager.downloader;

            for (const key of Object.keys(downloader)) {

                const table = downloader[key];

                if (table &&
                    table[".cconb"] &&
                    table[".dbbin"]) {

                    table[".dbbin"] = table[".cconb"];

                    console.log("[4399] dbbin -> cconb fixed");

                    clearInterval(timer);
                    return;
                }
            }
        }

    }, 10);

})();
</script>


<!-- Import map -->
