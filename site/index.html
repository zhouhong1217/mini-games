<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f2">
  <meta name="description" data-i18n-content="home.description" content="给自己一点游玩的时间。小鳄鱼爱洗澡、割绳子、窄道停车，挑一款小游戏，开始今天的小冒险。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>小游戏乐园 · 玩一会儿，刚刚好</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="i18n.js"></script>
  <script src="app.js" type="module"></script>
</head>
<body data-page-title="home.title">
  <a class="skip-link" href="#games" data-i18n="home.skip">跳到游戏列表</a>
  <header class="site-header wrap">
    <a class="brand" href="./" data-language-link aria-label="小游戏乐园首页" data-i18n-aria-label="home.aria">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="13" fill="currentColor"/><path d="M14 16v9m-4-4.5h8" stroke="#f7f8f2" stroke-width="2.5" stroke-linecap="round"/><circle cx="27" cy="18" r="2" fill="#f7f8f2"/><circle cx="24" cy="25" r="2" fill="#f7f8f2"/></svg>
      <span><span data-i18n="playground">小游戏乐园</span><small>LITTLE PLAYGROUND</small></span>
    </a>
    <div class="header-actions"><a class="header-link" href="#games"><span data-i18n="home.pick">挑个游戏</span> <span aria-hidden="true">↗</span></a><label class="language-picker"><span class="sr-only" data-i18n="languageLabel">语言</span><select data-language-select aria-label="语言" data-i18n-aria-label="languageLabel"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label></div>
  </header>
  <main class="wrap">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow"><span></span> <span data-i18n="home.eyebrow">给自己一点游玩的时间</span></p>
        <h1 id="hero-title"><span class="hero-line" data-i18n="home.headline1">玩一会儿，</span><br><span data-i18n="home.headline2">刚刚好。</span></h1>
        <p class="hero-description"><span data-i18n="home.intro1">挖一条水渠，剪一根绳子，停好一辆车。</span><br><span data-i18n="home.intro2">把忙碌放一边，开始今天的小冒险。</span></p>
      </div>
      <div class="hero-art" aria-hidden="true">
        <span class="orbit orbit-one"></span><span class="orbit orbit-two"></span>
        <span class="art-plus">+</span><span class="art-star">✦</span>
        <div class="play-tile"><svg viewBox="0 0 80 80"><path d="M31 22v36l29-18z" fill="currentColor"/></svg></div>
        <span class="art-caption">a little break, a little joy.</span>
      </div>
    </section>
    <section id="games" class="games-section" aria-labelledby="games-title">
      <div class="section-heading"><div><p class="eyebrow">PICK YOUR NEXT ADVENTURE</p><h2 id="games-title" data-i18n="home.gamesTitle">今天，玩点什么？</h2></div><span class="game-count" id="game-count" aria-live="polite">游戏加载中</span></div>
      <div class="game-grid" id="game-grid" aria-busy="true"></div>
      <p class="load-message" id="load-message" role="status">正在准备小游戏…</p>
      <noscript><p>请选择游戏：<a href="games/wheres-my-water/">小鳄鱼爱洗澡</a> · <a href="games/cut-the-rope/">割绳子</a> · <a href="games/narrow-parking/">窄道停车</a>。游玩需要开启 JavaScript。</p></noscript>
    </section>
    <aside class="play-note"><span class="note-symbol" aria-hidden="true">✳</span><div><strong data-i18n="home.noteTitle">轻松开玩，随时回来。</strong><p data-i18n="home.note">点击卡片即可进入游戏。支持存档的游戏将进度保存在当前浏览器中，换设备或清除网站数据后不会同步。</p></div></aside>
  </main>
  <footer class="site-footer wrap"><span data-i18n="home.footer">小游戏乐园 · 玩一会儿，刚刚好</span><span data-i18n="copyright">原游戏及素材版权归各自权利人所有</span></footer>
</body>
</html>
